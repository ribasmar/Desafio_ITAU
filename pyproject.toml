[project]
name = "copom-quant-ai"
version = "0.1.0"
description = "Estratégia quantitativa baseada no tom da comunicação do Copom (DI 1Y)."
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    # scipy entra por dois caminhos: scripts/analise/04_robustez.py (levene) e
    # copom.surprise.evento.estudo_evento (mannwhitneyu). Já o p-valor do
    # Clark-West sai de math.erfc, stdlib e mais preciso na cauda direita.
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "statsmodels>=0.14",
    "httpx>=0.27",
    # Extração de texto das atas publicadas só em PDF (bônus, ingest.atas_pdf):
    # pdfminer.six como extrator principal e pypdf como fallback para PDFs com
    # xref quebrado que o BCB publicou (ex.: ata 217).
    "pdfminer.six>=20240706",
    "pypdf>=4.0",
    "python-dotenv>=1.0",
    "jupyter>=1.0",
    # Extração LLM local: cliente Ollama. Alternativa: transformers + torch.
    "ollama>=0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# pythonpath resolve o layout src/ sem exigir `pip install -e .`: quem clonar o
# repo roda `pytest` da raiz e os imports de `copom` funcionam de primeira.
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
